name: Build Android APK

on:
  push:
    branches: [claude/mobile-responsive-download-nnyzhh, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore signing keystore (from repo secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > android/nexora-release.keystore

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          chmod +x android/gradlew
          cd android
          if [ -f nexora-release.keystore ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../nexora-erp.apk
          else
            # No stable key configured yet — debug build (signature varies per
            # run, so updating requires uninstalling the previous APK first).
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../nexora-erp.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nexora-erp-apk
          path: nexora-erp.apk

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-apk
          name: "Nexora ERP — Android App (APK)"
          body: |
            📱 **Nexora ERP للأندرويد**

            حمّل ملف `nexora-erp.apk` من الأسفل وافتحه على موبايلك لتثبيت التطبيق.
            (فعّل "التثبيت من مصادر غير معروفة" لو الموبايل طلب ذلك.)
          prerelease: true
          files: nexora-erp.apk
