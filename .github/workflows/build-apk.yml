name: Build Android APK

on:
  push:
    branches: [claude/mobile-responsive-download-nnyzhh, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nexora-erp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nexora-erp-apk
          path: nexora-erp.apk

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-apk
          name: "Nexora ERP — Android App (APK)"
          body: |
            📱 **Nexora ERP للأندرويد**

            حمّل ملف `nexora-erp.apk` من الأسفل وافتحه على موبايلك لتثبيت التطبيق.
            (فعّل "التثبيت من مصادر غير معروفة" لو الموبايل طلب ذلك.)
          prerelease: true
          files: nexora-erp.apk
